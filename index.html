<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Text-to-voice-converter</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="hero">
      <h1>Text to speech <span>Converter</span></h1>
      <textarea placeholder="Write any text here..."></textarea>
      <div class="row">
        <select></select>
        <button>Listen</button>
      </div>
  </div>


  <script>

    let speech = new SpeechSynthesisUtterance();
    let voice = [];
    let voiceSelect = document.querySelector('select');
    window.speechSynthesis.onvoiceschanged = ( ) =>{
      voice = window.speechSynthesis.getVoices();
      speech.voice = voice[0];

      voice.forEach((voice, i) =>(voiceSelect.options[i] = new Option(voice.name, i)))
    };

    voiceSelect.addEventListener("change", ()=>{
        speech.voice = voice[voiceSelect.value];
    } );

    document.querySelector("button").addEventListener("click", () => {
      speech.text = document.querySelector("textarea").value;
      window.speechSynthesis.speak(speech);
    });
  </script>
</body>
</html>
